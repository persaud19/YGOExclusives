[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"

# eBay sold-order sync — runs daily at 8:00 AM EST (13:00 UTC)
[functions."ebay-sync"]
  schedule = "0 13 * * *"
  timeout = 26

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
