name: Weekly Price Update & Market Analysis

on:
  schedule:
    - cron: '0 13 * * 1'   # Every Monday at 13:00 UTC (8am EST)
  workflow_dispatch:        # Manual trigger from GitHub Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run price update
        run: node scripts/price-update.js
        env:
          SUPABASE_URL: https://xyhzwmlqmazloyerelas.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  weekly-analysis:
    runs-on: ubuntu-latest
    needs: update-prices     # Waits for price snapshot to complete first
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run weekly market analysis
        run: node scripts/weekly-analysis.js
        env:
          SUPABASE_URL: https://xyhzwmlqmazloyerelas.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
